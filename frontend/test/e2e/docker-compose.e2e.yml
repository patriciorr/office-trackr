services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: office-trackr
    volumes:
      - ../../../mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ../../../backend
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/office-trackr?authSource=admin
      - JWT_SECRET=e2e-cypress-secret
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ../../../frontend
    ports:
      - '127.0.0.1::80'
    depends_on:
      - backend
