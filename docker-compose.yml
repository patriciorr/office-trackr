services:
  mongo:
    image: mongo:7
    container_name: office-trackr-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: office-trackr
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - office-trackr-network
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: office-trackr-backend
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/office-trackr?authSource=admin
      - JWT_SECRET=supersecretkey
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - mongo
    networks: 
      - office-trackr-network
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: office-trackr-frontend
    environment:
      - PORT=3000
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - office-trackr-network
    restart: unless-stopped

networks:
  office-trackr-network:
    driver: bridge

volumes:
  mongo_data:
